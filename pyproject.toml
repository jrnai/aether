[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-core"
version = "0.1.0"
description = "A modular, privacy-first local desktop automation agent paired with local LLMs and MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Junn Rong", email = "naijunnrong@gmail.com" }
]
dependencies = [
    "fastmcp>=0.4.0",
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "caldav>=1.3.9",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0",
    "icalendar>=5.0.0",
    "msal>=1.28.0",
    "winotify>=1.1.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "types-pyyaml>=6.0.12"
]
vector = [
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=3.0.0"
]
gcal = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0"
]
voice = [
    "sounddevice>=0.5.0",
    "openwakeword>=0.6.0",
    "faster-whisper>=1.0.0",
    "edge-tts>=7.0.0"
]

[project.scripts]
aether = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
