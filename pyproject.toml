[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-core"
version = "0.1.0"
description = "A modular, privacy-first local desktop automation agent paired with local LLMs and MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Aether Team" }
]
dependencies = [
    "fastmcp>=0.4.0",
    "mcp>=1.0.0",
    "ollama>=0.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "caldav>=1.3.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "types-pyyaml>=6.0.12"
]
vector = [
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=3.0.0"
]
gcal = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0"
]

[project.scripts]
aether = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
